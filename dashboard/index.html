<style>
  :root {
    --primary: #0052ff;
    --ink: #0a0b0d;
    --body: #5b616e;
    --muted: #7c828a;
    --muted-soft: #a8acb3;
    --hairline: #dee1e6;
    --hairline-soft: #eef0f3;
    --canvas: #ffffff;
    --surface-soft: #f7f7f7;
    --surface-strong: #eef0f3;
    --surface-dark: #0a0b0d;
    --surface-dark-elevated: #16181c;
    --on-dark: #ffffff;
    --on-dark-soft: #a8acb3;
    --up: #05b169;
    --down: #cf202f;
    --pending: #7c828a;      /* unfilled orders: neutral state, paired with labels + legend */

    --font-sans: Inter, -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    --r-sm: 8px; --r-md: 12px; --r-xl: 24px; --r-pill: 100px;
    --s-xs: 8px; --s-sm: 12px; --s-base: 16px; --s-lg: 24px; --s-xl: 32px; --s-xxl: 48px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--canvas); color: var(--ink); font: 400 16px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
  .num { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--s-lg); }

  /* top nav */
  .nav { position: sticky; top: 0; z-index: 10; background: var(--canvas); border-bottom: 1px solid var(--hairline); }
  .nav .wrap { height: 64px; display: flex; align-items: center; gap: var(--s-lg); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; white-space: nowrap; }
  .brand i { width: 24px; height: 24px; border-radius: 9999px; background: var(--primary); display: inline-block; position: relative; }
  .brand i::after { content: ""; position: absolute; inset: 7px; border-radius: 9999px; background: var(--canvas); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { appearance: none; border: 0; background: transparent; color: var(--body); font: 500 14px/1.4 var(--font-sans);
         padding: 8px 14px; border-radius: var(--r-pill); cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--surface-strong); color: var(--ink); }
  .tab:focus-visible, .step:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .pager { display: flex; align-items: center; gap: var(--s-xs); color: var(--muted); font-size: 13px; white-space: nowrap; }
  .step { width: 36px; height: 36px; border-radius: 9999px; border: 0; background: var(--surface-strong); color: var(--ink);
          font-size: 16px; cursor: pointer; }

  /* hero band */
  .hero { background: var(--surface-dark); color: var(--on-dark); padding: var(--s-xxl) 0; }
  .hero .wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--s-xl); align-items: center; }
  .eyebrow { display: inline-block; background: var(--surface-dark-elevated); color: var(--on-dark); font: 600 12px/1.5 var(--font-sans);
             letter-spacing: .04em; text-transform: uppercase; padding: 4px 12px; border-radius: var(--r-pill); }
  h1 { font-weight: 400; font-size: 44px; line-height: 1.09; letter-spacing: -1px; margin: var(--s-base) 0 var(--s-sm); }
  .lede { color: var(--on-dark-soft); margin: 0; max-width: 46ch; }
  .lede b { color: var(--on-dark); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-sm); }
  .tile { background: var(--surface-dark-elevated); border-radius: var(--r-xl); padding: var(--s-lg); min-width: 0; }
  .tile .label { color: var(--on-dark-soft); font-size: 13px; }
  .tile .value { font-family: var(--font-mono); font-weight: 500; font-size: 28px; line-height: 1.2; margin-top: 4px;
                 overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .tile .note { font-size: 13px; color: var(--on-dark-soft); margin-top: 2px; }
  .up { color: var(--up); } .down { color: var(--down); }

  /* content band */
  .band { padding: var(--s-xxl) 0 72px; background: var(--surface-soft); }
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--s-lg); }
  .card { grid-column: span 6; background: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-xl); padding: var(--s-xl); min-width: 0; }
  .card.wide { grid-column: span 12; } .card.third { grid-column: span 4; } .card.two-thirds { grid-column: span 8; }
  .card h2 { font-size: 18px; font-weight: 600; line-height: 1.33; margin: 0; }
  .card .sub { color: var(--body); font-size: 14px; margin: 4px 0 var(--s-lg); }
  .foot { color: var(--muted); font-size: 13px; margin-top: var(--s-base); }

  /* horizontal bars */
  .bars { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; gap: 14px var(--s-sm); align-items: center; }
  .bar-row { display: contents; }
  .bar-row .name { font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { height: 10px; position: relative; display: flex; gap: 2px; }
  .seg { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
  .seg + .seg { border-radius: 0 4px 4px 0; }
  .track .seg:not(:last-child) { border-radius: 0; }
  .bar-row .val { font: 500 14px/1 var(--font-mono); color: var(--ink); min-width: 72px; text-align: right; font-variant-numeric: tabular-nums; }

  /* columns */
  .cols { display: flex; align-items: flex-end; gap: var(--s-sm); height: 220px; padding-top: 24px; border-bottom: 1px solid var(--hairline); }
  .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; min-width: 0; }
  .col .bar { width: min(36px, 70%); border-radius: 4px 4px 0 0; background: var(--primary); }
  .col .bar.partial { background: repeating-linear-gradient(135deg, var(--primary) 0 3px, #6f97ff 3px 7px); }
  .col .cap { position: absolute; top: 0; font: 500 12px/1 var(--font-mono); color: var(--body); white-space: nowrap; }
  .col-labels { display: flex; gap: var(--s-sm); margin-top: var(--s-xs); }
  .col-labels span { flex: 1; text-align: center; color: var(--muted); font-size: 13px; }

  /* progress */
  .progress { height: 12px; background: var(--surface-strong); border-radius: var(--r-pill); overflow: hidden; margin: var(--s-base) 0 var(--s-xs); }
  .progress span { display: block; height: 100%; background: var(--primary); border-radius: var(--r-pill); }
  .big { font: 500 36px/1.1 var(--font-mono); letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .split { display: flex; justify-content: space-between; color: var(--body); font-size: 14px; }
  .stat-list { display: grid; gap: 0; margin-top: var(--s-lg); }
  .stat-list div { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--hairline-soft); font-size: 14px; color: var(--body); }
  .stat-list b { color: var(--ink); font: 500 14px/1.5 var(--font-mono); }

  /* legend */
  .legend { display: flex; gap: var(--s-base); font-size: 13px; color: var(--body); margin: calc(-1 * var(--s-sm)) 0 var(--s-base); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* tables */
  .table-scroll { overflow: auto; max-height: 560px; margin: 0 calc(-1 * var(--s-xs)); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 8px; position: sticky; top: 0; background: var(--canvas);
       border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  td { padding: 12px 8px; border-bottom: 1px solid var(--hairline-soft); white-space: nowrap; }
  td.n, th.n { text-align: right; }
  td.n { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .rank { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 9999px; background: var(--surface-strong);
          font: 500 12px/1 var(--font-mono); }
  .rank.first { background: var(--primary); color: #fff; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: var(--r-pill); font: 600 12px/1.5 var(--font-sans); background: var(--surface-strong); color: var(--ink); }
  .badge.pending { color: var(--body); }
  .badge::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 9999px; margin-right: 6px; vertical-align: 1px; background: var(--primary); }
  .badge.pending::before { background: var(--pending); }

  .slide[hidden] { display: none; }
  .tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface-dark); color: var(--on-dark); font-size: 13px;
         padding: 8px 12px; border-radius: var(--r-md); box-shadow: 0 4px 12px rgba(0,0,0,.04); opacity: 0; transition: opacity .1s; max-width: 260px; }
  .tip b { font-family: var(--font-mono); font-weight: 500; }
  [data-tip] { cursor: default; }
  footer { color: var(--muted); font-size: 13px; padding: var(--s-lg) 0; border-top: 1px solid var(--hairline); background: var(--canvas); }

  @media (max-width: 1024px) {
    .hero .wrap { grid-template-columns: minmax(0, 1fr); }
    .card, .card.third, .card.two-thirds { grid-column: span 12; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 var(--s-base); }
    .pager span { display: none; }
    .brand b { display: none; }

    .hero { padding: var(--s-xl) 0; }
    .tile { padding: var(--s-base); } .tile .value { font-size: 22px; }
    .card { padding: var(--s-lg) var(--s-base); }
    .band { padding: var(--s-lg) 0 var(--s-xxl); }
    .grid { gap: var(--s-base); }
    .bars { grid-template-columns: minmax(0, 38%) minmax(0, 1fr) auto; }
    .cols { gap: 6px; } .col-labels { gap: 6px; } .col .cap { font-size: 10px; }
  }
</style>

  {

    html: () => hero(3, "Customers", `${leaders.map(r => esc(r.customer)).join(" & ")} placed the most orders`,

      + `<section class="band"><div class="wrap grid">
        ${card("", "Top 10 customers by revenue", "Answers: what is the total revenue generated by each customer?",

                        tip: r => `${r.customer}: ${gbp.format(r.total_revenue)} from ${r.order_count} orders` }))}
        ${card("", "Most orders", "Answers: which customers have placed the most orders?",
          table([{ h: "Rank", f: r => `<span class="rank${r.order_rank === 1 ? " first" : ""}">${r.order_rank}</span>` },
                 { h: "Customer", k: "customer" }, { h: "Orders", n: 1, f: r => r.order_count },
                 { h: "Cookies", n: 1, f: r => int.format(r.cookies_ordered) }], CO.slice(0, 10)),
          `Ties share a rank. ${inactive.length ? `No orders yet: ${inactive.map(r => esc(r.customer)).join(", ")}.` : ""}`)}
        ${card("wide", "All customers", "Revenue, orders and cookies for every customer",

/* ---------- navigation ---------- */
const tabs = document.getElementById("tabs"), main = document.getElementById("slides");
SLIDES.forEach((s, i) => {
  tabs.insertAdjacentHTML("beforeend", `<button class="tab" role="tab" id="tab-${s.id}" aria-controls="slide-${s.id}" data-i="${i}">${s.name}</button>`);
  main.insertAdjacentHTML("beforeend", `<div class="slide" role="tabpanel" id="slide-${s.id}" aria-labelledby="tab-${s.id}" hidden>${s.html()}</div>`);
});
let current = 0;
function show(i, push = true) {
  current = (i + SLIDES.length) % SLIDES.length;
  SLIDES.forEach((s, j) => {
    document.getElementById(`slide-${s.id}`).hidden = j !== current;
    document.getElementById(`tab-${s.id}`).setAttribute("aria-selected", j === current);
  });
  document.getElementById("count").textContent = `${current + 1} / ${SLIDES.length}`;
  const tab = document.getElementById(`tab-${SLIDES[current].id}`);
  tabs.scrollLeft = Math.max(0, tab.offsetLeft - tabs.offsetLeft - 16);
  if (push) history.replaceState(null, "", `#${SLIDES[current].id}`);
  window.scrollTo(0, 0);
}
tabs.addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) show(+b.dataset.i); });
document.getElementById("prev").onclick = () => show(current - 1);
document.getElementById("next").onclick = () => show(current + 1);
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") show(current + 1);
  if (e.key === "ArrowLeft") show(current - 1);
});
show(Math.max(0, SLIDES.findIndex(s => `#${s.id}` === location.hash)), false);

/* ---------- tooltip ---------- */
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = e.clientY + 16;
  tip.style.transform = `translate(${x}px, ${y}px)`; tip.style.left = tip.style.top = 0; tip.style.opacity = 1;
});

document.getElementById("footer").textContent =
  `Source: PostgreSQL cookie_creations (analysis.* views). Snapshot built ${date(DATA.generated)}; re-run scripts/build_html_dashboard.py to refresh. Revenue is the stored order revenue.`;
</script>
